name: ExarotonManager
version: 2.2.0
author: Egemen
main: com.example.exaroton.ExarotonManager
api-version: 1.20
description: Advanced Exaroton server management plugin by Egemen. Native transfer support.
commands:
  exaroton:
    description: Main ExarotonManager command
    permission: exaroton.admin
    usage: /exaroton <help|info|source|plugin|enable|disable|api|aternos|list|start|stop|restart|status|command|switch|run|server IF status run cmd>
permissions:
  exaroton.admin:
    description: Full access to ExarotonManager
    default: op
